faq:
  section_tag: Got Questions?
  title: ''
  entries:
  - question: How do I book a session?
    answer: Simply fill out my contact form, send me an email, or message me on social
      media! Once we choose a date and location, I'll send over all the details to
      make your session stress-free.
    open: true
  - question: What types of photography do you offer?
    answer: I currently offer seniors, couples, engagements, maternity, and select
      weddings.
  - question: Where are you located?
    answer: I'm based in West Michigan and serve the surrounding areas. I'm always
      open to traveling for sessions and special events. Travel fees may apply depending
      on the distance.
  - question: How long does it take to receive my photos?
    answer: Each session is different! Typical portrait sessions are delivered within
      2–3 weeks. Wedding galleries may take longer with a 1-3 month return.
  - question: How will I receive my photos?
    answer: You'll receive an online gallery where you can view, download, and share
      your images with family and friends.
  - question: What happens if the weather is bad?
    answer: If weather impacts your outdoor session, we'll work together to reschedule
      for the next available date.
  - question: Do you require a deposit?
    answer: Yes, a non-refundable retainer is required to secure your date. The remaining
      balance is due before your session or event.
  - question: What is your editing style?
    answer: My editing style is light and airy. I want them to feel dreamy, clean,
      and timeless.
