about:
  section_tag: ''
  title: 'Hi friend, I''m Jenna!'
  portrait: photos/about/jenna-portrait.jpg
  portrait_alt: Jenna Lynn — Seniors, Couples, and Wedding Photographer
  paragraphs:
  - I'm a West Michigan photographer based in Grand Rapids. I believe some of life's
    sweetest moments deserve to be remembered forever. Whether you're celebrating
    a senior year, growing your family, getting engaged, or saying "I do," I'd love
    to capture timeless photos for you. When I'm not behind the camera I'm probably
    at a coffee shop somewhere, teaching dance, Bible studying with friends, or
    golfing with my boyfriend Matt!
  - I'd love the opportunity to get to know you and take some photos you love! Let's
    get in touch! Please fill out my connect form to get the ball rolling!
  cta_text: Let's Get to Know Each Other
  cta_href: '#contact'
