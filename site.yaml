about:
  section_tag: Meet Jenna
  title: 'I''m Not Just Your Photographer —

    I''m Your Biggest Hype Girl'
  portrait: photos/about/jenna-portrait.jpg
  portrait_alt: Jenna Lynn — Wedding & Couples Photographer
  paragraphs:
  - I believe God writes beautiful love stories, and your photo session should reflect
    that. No stiff poses, no awkward silences — just the two of you, being completely
    yourselves, while I capture the real moments that matter.
  - Whether you're newly engaged, celebrating an anniversary, or saying "I do" — I'm
    here to make you feel confident, comfortable, and completely cared for. I'll hype
    you up, make you laugh (dad jokes included), and deliver a gallery that makes
    you fall in love all over again.
  - Proudly Michigan-made. I was born and raised in the Great Lakes State, and there's
    nowhere I'd rather build my business. Michigan gives us four breathtaking seasons,
    endless lakeshore backdrops, and sunsets that paint the sky over Lake Michigan
    in ways that make my camera weep with joy. Whether we're shooting among the dunes
    of Sleeping Bear, beneath a canopy of autumn maples, or in a cozy downtown café
    in Grand Rapids — this state is part of your story, and I wouldn't have it any
    other way.
  - Every love story is a gift from above — and it's my joy to help you tell yours.
    Based in [City], Michigan — available for travel worldwide.
  cta_text: Let's Get to Know Each Other
  cta_href: '#contact'
