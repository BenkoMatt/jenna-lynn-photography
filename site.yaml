process:
  section_tag: How It Works
  title: From First Hello to Final Gallery
  subtitle: I've designed every step to be easy, personal, and actually fun.
  steps:
  - number: '01'
    title: Connect
    text: Fill out the inquiry form and tell me all about you two! I'll get back to
      you within 24 hours — usually sooner. I pray over every inquiry and can't wait
      to hear your story.
  - number: '02'
    title: Plan
    text: I'll send over my shoot guide, a fun couples questionnaire, and we'll plan
      out every detail — from location scouting to outfit coordination. No stress,
      just joyful anticipation!
  - number: '03'
    title: Party
    text: Shoot day should feel like a celebration! I'll guide you through natural
      poses, crack jokes, hype you up, and capture the real joy that happens when
      you're just being yourselves — the way God made you.
  - number: '04'
    title: Relive
    text: Within 72 hours you'll see sneak peeks, and your full gallery arrives within
      3–4 weeks. Every image hand-edited with care — because your story deserves nothing
      less. Ready to print, share, and treasure forever.
faq:
  section_tag: Got Questions?
  title: The Couple Session Q&A
  entries:
  - question: We're not models — are you sure this is for us?
    answer: Absolutely! Most of my couples have never had professional photos taken
      before. That's my specialty — making you feel completely at ease, guiding you
      into flattering poses, and capturing genuine moments. God created you beautifully,
      and my job is simply to let that shine through!
    open: true
  - question: How many images will we receive and when?
    answer: Depending on your session length, you'll receive 50–75+ fully edited high-resolution
      images. Sneak peeks land in your inbox within 72 hours, and the full gallery
      is delivered within 3–4 weeks.
  - question: What's your editing style?
    answer: My style is bright, warm, and true-to-life with a touch of editorial polish.
      I focus on clean skin tones, vibrant colors, and natural light — photos that
      feel timeless, not trendy.
  - question: Do you offer payment plans?
    answer: Yes! I totally understand that life gets expensive. Payment plans are
      available for all packages — just ask when you inquire. I never want cost to
      be the reason you miss out on documenting the love story God gave you.
  - question: What if it rains on our session day?
    answer: No worries! I keep a close eye on the forecast and we'll reschedule if
      needed — no extra charge. Some of my favorite sessions have happened on overcast
      days with the most beautiful soft light. Even the weather is in His hands!
  - question: Do you travel for sessions?
    answer: Yes! I'm based in [City], Michigan and include travel within a 30-mile
      radius. For destinations further afield, I'm happy to provide a custom travel
      quote. Adventure sessions are my favorite!
